server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /ops/health/gateway {
        proxy_pass http://api-gateway:8080/actuator/health;
    }

    location = /ops/health/discovery {
        proxy_pass http://discovery-server:8761/actuator/health;
    }

    location = /ops/health/meter {
        proxy_pass http://meter-service:8081/actuator/health;
    }

    location = /ops/health/reading {
        proxy_pass http://reading-service:8082/actuator/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
