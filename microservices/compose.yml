services:
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: discovery-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8080:8080"

  meter-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: meter-service
    environment:
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    ports:
      - "8081:8081"

  reading-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: reading-service
    depends_on:
      - discovery-server
      - meter-service
    environment:
      SERVER_PORT: 8082
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    ports:
      - "8082:8082"

  learning-ui:
    build:
      context: ./learning-ui
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
