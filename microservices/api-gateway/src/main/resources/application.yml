server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: meter-service
          uri: lb://meter-service
          predicates:
            - Path=/api/meters/**
        - id: reading-service
          uri: lb://reading-service
          predicates:
            - Path=/api/readings/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
